name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build gallery site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install templ CLI
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate templ sources
        run: templ generate

      - name: Install JS dependencies
        run: bun install

      - name: Build frontend assets
        run: bun run build

      - name: Export static site
        # GitHub Pages serves this repo at /<repo>/; the export renders every
        # gallery link and asset URL under that base.
        run: go run ./examples/gallery/cmd/export -base "/${{ github.event.repository.name }}" site

      - name: Check asset URLs carry the base
        run: |
          if grep -rlE '(href|src)="/static/' site --include='*.html'; then
            echo "exported pages reference /static/ without the Pages base"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4