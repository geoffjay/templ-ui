name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ CLI
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate templ sources
        run: templ generate

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        run: golangci-lint run ./daisyui/... ./shiki/... ./containers/... ./internal/... ./examples/...

      - name: Check gofmt
        run: |
          out=$(gofmt -l . | grep -v node_modules || true)
          if [ -n "$out" ]; then echo "gofmt needs to format:"; echo "$out"; exit 1; fi

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test against the declared minimum (go.mod floor) and the latest
        # stable release so the supported version window stays honest.
        go: ['1.25.0', 'stable']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Install templ CLI
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate templ sources
        run: templ generate

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  assets:
    name: Frontend assets build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install

      - name: Build assets
        run: bun run build

      - name: Static export smoke test
        run: |
          go run ./examples/gallery/cmd/export examples/gallery/dist
          test -f examples/gallery/dist/index.html
          test -f examples/gallery/dist/static/styles.css
          test -f examples/gallery/dist/static/shiki.js